  <div id="ro-banner" style="position:fixed;right:14px;bottom:12px;z-index:9999;background:#0f62fe;color:#fff;
padding:6px 12px;border-radius:14px;font:12px/1.5 'Microsoft YaHei',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.18)">
静态快照 · 只读 · 数据已脱敏</div>
<script>
(function(){
  var BASE = (location.pathname.match(/^\/[^\/]+/) || [''])[0];
  try{
    ['pushState','replaceState'].forEach(function(fn){
      var orig = history[fn];
      history[fn] = function(s, t, u){
        try{
          if(typeof u === 'string' && u.charAt(0) === '/' && BASE &&
             u !== BASE && u.indexOf(BASE + '/') !== 0){
            u = BASE + u;
          }
        }catch(e){}
        return orig.call(history, s, t, u);
      };
    });
  }catch(e){}

  var _fetch = window.fetch ? window.fetch.bind(window) : null;
  var cache = {};
  function load(url){
    if(!cache[url]){
      cache[url] = _fetch(url).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
    }
    return cache[url];
  }
  var MAP = {
    '/api/dashboard': 'data/dashboard.json',
    '/api/board': 'data/board.json',
    '/api/expense': 'data/expense.json',
    '/api/pending': 'data/pending.json',
    '/api/cancel': 'data/cancel.json',
    '/api/merchant/list': 'data/merchant_list.json'
  };
  function parse(u){
    var s = String(u === undefined || u === null ? '' : u);
    var i = s.indexOf('api/');
    if(i < 0) return null;
    var p = s.slice(i + 3);
    var q = p.indexOf('?');
    if(q >= 0) p = p.slice(0, q);
    return '/api' + p;
  }
  function respond(u){
    var p = parse(u);
    if(!p) return null;
    if(MAP[p]) return load(MAP[p]);
    var m = p.match(/^\/api\/board\/(.+)$/);
    if(m){
      var sid = decodeURIComponent(m[1]);
      return load('data/board.json').then(function(d){
        var rows = (d && d.data && d.data.rows) || [];
        var st = null;
        for(var i = 0; i < rows.length; i++){
          if(String(rows[i].site_id) === sid){ st = rows[i]; break; }
        }
        return {ok: true, message: 'ok', data: {station: st, merchant_profiles: [], warn_records: [], pending: [], cancel: []}};
      });
    }
    return Promise.resolve({ok: false, message: '静态快照为只读，该操作不可用', data: null});
  }

  var _open = XMLHttpRequest.prototype.open;
  var _send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function(method, url){
    this.__url = url;
    return _open.apply(this, arguments);
  };
  // readyState / status / responseText / response 在 XMLHttpRequest.prototype 上是只读
  // 取值器，直接赋值会静默失败（axios 读到 status=0 会判定 abort）。这里用实例级影子属性覆写。
  function def(xhr, key, val){
    try{ Object.defineProperty(xhr, key, {configurable: true, get: function(){ return val; }}); }catch(e){}
  }
  function fake(xhr, obj){
    var text = JSON.stringify(obj === null ? {} : obj);
    var body;
    try{ body = JSON.parse(text); }catch(e){ body = text; }
    def(xhr, 'readyState', 4);
    def(xhr, 'status', 200);
    def(xhr, 'statusText', 'OK');
    def(xhr, 'responseText', text);
    def(xhr, 'response', body);
    def(xhr, 'responseURL', String(xhr.__url || ''));
    xhr.getAllResponseHeaders = function(){ return 'content-type: application/json\r\n'; };
    xhr.getResponseHeader = function(){ return 'application/json'; };
    if(typeof xhr.onreadystatechange === 'function') xhr.onreadystatechange();
    if(typeof xhr.onload === 'function') xhr.onload();
    if(typeof xhr.onloadend === 'function') xhr.onloadend();
    try{ xhr.dispatchEvent(new Event('load')); xhr.dispatchEvent(new Event('loadend')); }catch(e){}
  }
  XMLHttpRequest.prototype.send = function(body){
    var self = this;
    var p = respond(this.__url);
    if(!p) return _send.apply(this, arguments);
    p.then(function(obj){ fake(self, obj); });
  };

  if(_fetch){
    window.fetch = function(input, init){
      var u = (typeof input === 'string') ? input : (input && input.url);
      var p = respond(u);
      if(!p) return _fetch.apply(window, arguments);
      return p.then(function(d){
        return new Response(JSON.stringify(d === null ? {} : d),
          {status: 200, headers: {'Content-Type': 'application/json; charset=utf-8'}});
      });
    };
  }
})();
</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
